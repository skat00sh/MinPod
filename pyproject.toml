[project]
name = "minpod"
version = "0.1.0"
description = "Local Kokoro-82M text-to-speech to MP3"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "kokoro>=0.9.4",
    "numpy>=2.4.6",
    "psutil>=7.2.2",
    "soundfile>=0.14.0",
]

[project.scripts]
minpod = "minpod.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["minpod"]
